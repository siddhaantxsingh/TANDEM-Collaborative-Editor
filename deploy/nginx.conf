# max_fails=0: no passive "server down" marking. With marking, after every
# node had failed once (a rolling restart), nginx let one probe request
# through per fail_timeout and cleared the mark only when that request
# completed; a WebSocket probe completes when the socket closes, so the
# upstreams stayed "down" for minutes (found by the rolling-restart smoke
# test, docs/DEPLOYMENT.md). A refused or timed-out connect is still retried
# on the other node within the same request (proxy_next_upstream).
upstream tandem {
  server app1:8080 max_fails=0;
  server app2:8080 max_fails=0;
}
server {
  listen 80;
  client_max_body_size 128k;
  # nginx is the only entry point: the app trusts the address it appends to
  # X-Forwarded-For (TRUST_PROXY=true). $request_id correlates nginx and app logs.
  proxy_connect_timeout 2s;
  proxy_next_upstream error timeout;
  location /ws {
    proxy_pass http://tandem;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }
  # Metrics are scraped from inside the network, not through the proxy.
  location = /metrics { return 404; }
  location / {
    proxy_pass http://tandem;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
  }
}
